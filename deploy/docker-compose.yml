services:
  # ==========================================================
  # PostgreSQL
  # ==========================================================
  postgres:
    image: postgres:17-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: wangbo
      POSTGRES_USER: wangbo
      POSTGRES_PASSWORD: Wb@qwer4321
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    volumes:
      # Database initialization scripts
      - ../cloud/migrations:/docker-entrypoint-initdb.d:ro
      # PostgreSQL logs
      - ./postgres/logs:/var/log/postgresql

  # ==========================================================
  # Redis
  # ==========================================================
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    command: redis-server --appendonly yes
  # ==========================================================
  # OpenIndustrial Cloud Backend
  # ==========================================================
  cloud:
    image: openindustrial-cloud:latest
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - "./cloud/config/config.yaml:/app/config.yaml"
      - "./cloud/logs:/app/logs/debug"
    depends_on:
      - postgres
      - redis
  # ==========================================================
  # Nginx
  # ==========================================================
  nginx:
    image: nginx:latest
    container_name: openindustrial-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - "./nginx/config/conf/nginx.conf:/etc/nginx/nginx.conf"
      - "./nginx/config/html:/usr/share/nginx/html"
      - "./nginx/logs:/var/log/nginx"
      - "./nginx/config/conf.d/default.conf:/etc/nginx/conf.d/default.conf"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
